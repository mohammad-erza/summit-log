<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Summit Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    .admin-container {
      max-width: 800px;
      margin: 4rem auto;
      padding: 0 1.5rem;
    }
    .admin-header {
      border-bottom: 1px solid var(--line);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-header h1 {
      font-family: 'Fraunces', serif;
      font-size: 2.2rem;
    }
    .admin-auth {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 1.5rem;
      border-radius: 4px;
      margin-bottom: 2rem;
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .admin-auth label {
      font-size: 0.85rem;
      font-weight: 500;
    }
    .admin-input {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 4px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
    }
    .admin-btn {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.5rem 1.25rem;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .admin-btn:hover {
      background: var(--moss);
      color: var(--paper);
      border-color: var(--moss);
    }
    .admin-btn.danger:hover {
      background: var(--clay);
      color: var(--paper);
      border-color: var(--clay);
    }
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 2.5rem;
    }
    @media (max-width: 768px) {
      .admin-grid {
        grid-template-columns: 1fr;
      }
    }
    .admin-section {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 1.5rem;
      border-radius: 4px;
      height: fit-content;
    }
    .admin-section h2 {
      font-family: 'Fraunces', serif;
      font-size: 1.4rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.5rem;
    }
    .form-group {
      margin-bottom: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .form-group label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--moss);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .textarea-input {
      resize: vertical;
      min-height: 80px;
    }
    .mountain-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--line);
    }
    .mountain-item:last-child {
      border-bottom: none;
    }
    .mountain-info h4 {
      font-family: 'Fraunces', serif;
      font-size: 1.15rem;
    }
    .mountain-info p {
      font-size: 0.75rem;
      opacity: 0.7;
    }
    .mountain-actions {
      display: flex;
      gap: 0.5rem;
    }
    .status-msg {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 4px;
      font-size: 0.85rem;
      display: none;
    }
    .status-msg.success {
      background: #e3e9e3;
      color: var(--moss);
      border: 1px solid var(--moss);
      display: block;
    }
    .status-msg.error {
      background: #f2e3d5;
      color: var(--clay);
      border: 1px solid var(--clay);
      display: block;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <h1>Summit Log Admin</h1>
      <a href="../" class="admin-btn">View Site</a>
    </div>

    <div class="admin-auth">
      <label for="admin-pass">Admin Password:</label>
      <input type="password" id="admin-pass" class="admin-input" placeholder="Enter password...">
      <span style="font-size: 0.75rem; opacity: 0.6;">(Auto-saved locally)</span>
    </div>

    <div id="status-box" class="status-msg"></div>

    <div class="admin-grid">
      <!-- Left column: Add/Edit form -->
      <div class="admin-section">
        <h2 id="form-title">Add New Mountain</h2>
        <form id="mountain-form">
          <input type="hidden" id="edit-index" value="-1">
          
          <div class="form-group">
            <label for="m-name">Mountain Name</label>
            <input type="text" id="m-name" class="admin-input" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="m-elevation">Elevation (meters)</label>
              <input type="number" id="m-elevation" class="admin-input" required>
            </div>
            <div class="form-group">
              <label for="m-location">Location (Region/Island)</label>
              <input type="text" id="m-location" class="admin-input" placeholder="e.g. Lombok" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="m-status">Status</label>
              <select id="m-status" class="admin-input" required>
                <option value="climbed">Climbed</option>
                <option value="planning">Planning</option>
                <option value="someday">Someday</option>
              </select>
            </div>
            <div class="form-group">
              <label for="m-date">Date Tag</label>
              <input type="text" id="m-date" class="admin-input" placeholder="e.g. July 2024 or Someday" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="m-lat">Latitude</label>
              <input type="number" step="any" id="m-lat" class="admin-input" required>
            </div>
            <div class="form-group">
              <label for="m-lng">Longitude</label>
              <input type="number" step="any" id="m-lng" class="admin-input" required>
            </div>
          </div>

          <div class="form-group">
            <label for="m-description">Description / Field Notes</label>
            <textarea id="m-description" class="admin-input textarea-input" required></textarea>
          </div>

          <div style="display: flex; gap: 0.75rem;">
            <button type="submit" class="admin-btn">Save Mountain</button>
            <button type="button" id="cancel-btn" class="admin-btn" style="display: none;">Cancel</button>
          </div>
        </form>
      </div>

      <!-- Right column: List of mountains -->
      <div class="admin-section">
        <h2>Logged Peaks</h2>
        <div id="mountains-list">
          <p style="font-size: 0.9rem; opacity: 0.6;">Loading database...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let mountainsData = [];

    // Load saved password
    const passInput = document.getElementById('admin-pass');
    passInput.value = localStorage.getItem('summit_admin_pass') || '';
    passInput.addEventListener('input', () => {
      localStorage.setItem('summit_admin_pass', passInput.value);
    });

    // Helper to display status message
    function showStatus(text, type = 'success') {
      const box = document.getElementById('status-box');
      box.textContent = text;
      box.className = `status-msg ${type}`;
      setTimeout(() => {
        box.style.display = 'none';
      }, 5000);
    }

    // Fetch initial database
    async function loadData() {
      try {
        const response = await fetch('../mountains.json');
        if (!response.ok) throw new Error('Failed to load database file');
        mountainsData = await response.json();
        renderList();
      } catch (err) {
        showStatus('Error loading mountains.json: ' + err.message, 'error');
      }
    }

    // Render list on the right side
    function renderList() {
      const listEl = document.getElementById('mountains-list');
      if (mountainsData.length === 0) {
        listEl.innerHTML = '<p style="font-size: 0.9rem; opacity: 0.6;">No mountains in database.</p>';
        return;
      }

      listEl.innerHTML = '';
      mountainsData.forEach((m, idx) => {
        const item = document.createElement('div');
        item.className = 'mountain-item';
        item.innerHTML = `
          <div class="mountain-info">
            <h4>${m.name}</h4>
            <p>${m.location} · ${m.elevation.toLocaleString()} m · <span style="text-transform: capitalize; font-weight: 600;">${m.status}</span></p>
          </div>
          <div class="mountain-actions">
            <button class="admin-btn" onclick="editMountain(${idx})" style="padding: 0.3rem 0.75rem; font-size: 0.75rem;">Edit</button>
            <button class="admin-btn danger" onclick="deleteMountain(${idx})" style="padding: 0.3rem 0.75rem; font-size: 0.75rem;">Delete</button>
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    // Fill form for editing
    window.editMountain = function(idx) {
      const m = mountainsData[idx];
      document.getElementById('edit-index').value = idx;
      document.getElementById('m-name').value = m.name;
      document.getElementById('m-elevation').value = m.elevation;
      document.getElementById('m-location').value = m.location;
      document.getElementById('m-status').value = m.status;
      document.getElementById('m-date').value = m.date;
      document.getElementById('m-lat').value = m.coords[0];
      document.getElementById('m-lng').value = m.coords[1];
      document.getElementById('m-description').value = m.description;

      document.getElementById('form-title').textContent = `Edit Mountain: ${m.name}`;
      document.getElementById('cancel-btn').style.display = 'inline-block';
    }

    // Cancel edit state
    document.getElementById('cancel-btn').addEventListener('click', resetForm);

    function resetForm() {
      document.getElementById('mountain-form').reset();
      document.getElementById('edit-index').value = '-1';
      document.getElementById('form-title').textContent = 'Add New Mountain';
      document.getElementById('cancel-btn').style.display = 'none';
    }

    // Save changes (Add / Update)
    document.getElementById('mountain-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const idx = parseInt(document.getElementById('edit-index').value);
      const newMountain = {
        name: document.getElementById('m-name').value,
        elevation: parseInt(document.getElementById('m-elevation').value),
        status: document.getElementById('m-status').value,
        location: document.getElementById('m-location').value,
        date: document.getElementById('m-date').value,
        coords: [
          parseFloat(document.getElementById('m-lat').value),
          parseFloat(document.getElementById('m-lng').value)
        ],
        description: document.getElementById('m-description').value
      };

      if (idx === -1) {
        // Add
        mountainsData.push(newMountain);
      } else {
        // Edit
        mountainsData[idx] = newMountain;
      }

      await saveToGitHub();
      resetForm();
    });

    // Delete mountain
    window.deleteMountain = async function(idx) {
      if (!confirm(`Are you sure you want to delete ${mountainsData[idx].name}?`)) return;
      mountainsData.splice(idx, 1);
      await saveToGitHub();
    }

    // Call serverless api to write back to GitHub
    async function saveToGitHub() {
      const password = passInput.value;
      if (!password) {
        showStatus('Please enter the Admin Password first.', 'error');
        return;
      }

      try {
        const response = await fetch('../api/update-mountains', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            password: password,
            data: mountainsData
          })
        });

        const resData = await response.json();
        if (!response.ok) {
          throw new Error(resData.error || 'Server error');
        }

        showStatus('Changes successfully committed to GitHub!');
        renderList();
      } catch (err) {
        showStatus('Save failed: ' + err.message, 'error');
      }
    }

    // Init
    loadData();
  </script>
</body>
</html>
